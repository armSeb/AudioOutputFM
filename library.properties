name=AudioOutputFM
version=0.9.8
author=Seb, with code written by Claude (Anthropic)
maintainer=Seb
sentence=ESP8266Audio output that turns a classic ESP32 into an FM broadcast transmitter (88-108 MHz, mono or stereo with RDS), using its APLL on GPIO0.
paragraph=Drop-in replacement for AudioOutputI2S: new AudioOutputFM(100.1) then mp3->begin(src, out). Stereo multiplex at 133 kHz with RDS (PS, RadioText from the stream title), 50/75 us pre-emphasis, AGC, limiter. Includes a complete web-configured transmitter (MP3/AAC web radios, OTA, 24/7 operation). Experimental: raw square-wave RF output, a low-pass filter is required.
category=Signal Input/Output
url=https://github.com/armSeb/AudioOutputFM
architectures=esp32
depends=ESP8266Audio
